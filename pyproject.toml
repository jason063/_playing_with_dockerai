[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oop"
version = "0.1.0"
description = "OOP classes for Flask project"
authors = [
    { name = "Neeraj Sharma" }
]
dependencies = ["flask"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oop*"]
